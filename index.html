<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuslSearch</title>
    <!-- Подключение OpenSearch для LibreWolf -->
    <link rel="search" type="application/opensearchdescription+xml" title="RuslSearch" href="opensearch.xml">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #00ffcc;
            --glow: rgba(0, 255, 204, 0.25);
            --text: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px var(--glow);
        }

        h1 span {
            color: var(--accent);
        }

        .search-form {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px 20px;
            font-size: 1.05rem;
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--glow);
        }

        button.search-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.search-btn:hover {
            background-color: #00e6b8;
            box-shadow: 0 0 10px var(--accent);
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 10px;
        }

        .result-card:hover {
            border-color: var(--accent);
        }

        .result-title a {
            color: var(--accent);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-url {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 4px 0 8px 0;
            word-break: break-all;
        }

        .result-snippet {
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>RUSL<span>SEARCH</span></h1>
        </header>

        <form id="searchForm" class="search-form" action="index.html" method="get">
            <input type="text" name="q" id="searchInput" placeholder="Введите запрос..." required autocomplete="off">
            <button type="submit" class="search-btn">НАЙТИ</button>
        </form>

        <div id="loading" class="loading" style="display: none;">⚡ RuslSearch ищет ответы...</div>
        <div id="results" class="results-container"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const loading = document.getElementById('loading');

        if (query) {
            input.value = query;
            document.title = `${query} — RuslSearch`;
            executeSearch(query);
        }

        function executeSearch(q) {
            loading.style.display = 'block';

            // Проверка на команды быстрых сайтов
            if (q.startsWith('/github') || q.startsWith('/gh')) {
                const term = q.replace(/^\/(github|gh)\s*/i, '');
                window.location.href = `https://github.com/search?q=${encodeURIComponent(term)}`;
                return;
            } 
            if (q.startsWith('/youtube') || q.startsWith('/yt')) {
                const term = q.replace(/^\/(youtube|yt)\s*/i, '');
                window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}`;
                return;
            }

            // Перенаправление на стилизованную выдачу RuslSearch
            const targetUrl = `https://duckduckgo.com/?q=${encodeURIComponent(q)}&kae=d&k7=0d1117&k9=00ffcc&kx=00e6b8`;
            
            // Отображение перенаправления в интерфейсе
            loading.innerText = `⚡ Переход к результатам RuslSearch по запросу «${q}»...`;
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuslSearch</title>
    <link rel="search" type="application/opensearchdescription+xml" title="RuslSearch" href="opensearch.xml">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #00ffcc;
            --glow: rgba(0, 255, 204, 0.25);
            --text: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--glow);
            margin-bottom: 5px;
        }

        h1 span {
            color: var(--accent);
        }

        p.sub {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .search-form {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.15rem;
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }

        button.search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 26px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.search-btn:hover {
            background-color: #00e6b8;
            box-shadow: 0 0 12px var(--accent);
        }

        #status {
            color: var(--accent);
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>RUSL<span>SEARCH</span></h1>
            <p class="sub">Быстрый поисковый шлюз</p>
        </header>

        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" placeholder="Введите любой запрос..." required autocomplete="off" autofocus>
            <button type="submit" class="search-btn">НАЙТИ</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const status = document.getElementById('status');

        // Читаем запрос из URL: ?q=запрос или /запрос
        function getQueryFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let q = urlParams.get('q');
            
            if (!q) {
                // Вытаскиваем текст после /RuslSearch/
                const pathname = window.location.pathname;
                const parts = pathname.split('/').filter(Boolean);
                if (parts.length > 1) {
                    q = decodeURIComponent(parts.slice(1).join('/'));
                }
            }
            return q;
        }

        function processSearch(query) {
            if (!query) return;

            input.value = query;
            document.title = `${query} — RuslSearch`;
            status.innerText = `⚡ Поиск по запросу «${query}»...`;

            let targetUrl = '';

            // Команды перенаправления
            if (query.startsWith('/github') || query.startsWith('/gh')) {
                const term = query.replace(/^\/(github|gh)\s*/i, '');
                targetUrl = `https://github.com/search?q=${encodeURIComponent(term)}`;
            } 
            else if (query.startsWith('/youtube') || query.startsWith('/yt')) {
                const term = query.replace(/^\/(youtube|yt)\s*/i, '');
                targetUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}`;
            } 
            else {
                // Перенаправление на стилизованный DuckDuckGo под темы RuslSearch
                targetUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}&kae=d&k7=0d1117&k9=00ffcc&kx=00e6b8`;
            }

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 200);
        }

        // Автозапуск при переходе по ссылке из LibreWolf
        const initialQuery = getQueryFromURL();
        if (initialQuery) {
            processSearch(initialQuery);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = input.value.trim();
            processSearch(q);
        });
    </script>
</body>
</html>

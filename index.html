<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuslSearch</title>
    <link rel="search" type="application/opensearchdescription+xml" title="RuslSearch" href="opensearch.xml">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #00ffcc;
            --glow: rgba(0, 255, 204, 0.25);
            --text: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--glow);
            margin-bottom: 5px;
        }

        h1 span {
            color: var(--accent);
        }

        p.sub {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .search-form {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.15rem;
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }

        button.search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 26px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.search-btn:hover {
            background-color: #00e6b8;
            box-shadow: 0 0 12px var(--accent);
        }

        #status {
            color: var(--accent);
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>RUSL<span>SEARCH</span></h1>
            <p class="sub">Движок на базе 4get</p>
        </header>

        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" placeholder="Введите любой запрос..." required autocomplete="off" autofocus>
            <button type="submit" class="search-btn">НАЙТИ</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // Функция перенаправления на 4get
        function redirectTo4get(query) {
            if (!query) return;
            document.getElementById('status').innerText = `⚡ Перенаправление на 4get: «${query}»...`;
            // Переход на официальный движок 4get
            window.location.replace(`https://4get.ca/web?q=${encodeURIComponent(query)}`);
        }

        // 1. Проверяем параметры URL (?q=...) или путь (/запрос) из адресной строки LibreWolf
        const urlParams = new URLSearchParams(window.location.search);
        let query = urlParams.get('q');

        if (!query) {
            const pathname = window.location.pathname;
            const parts = pathname.split('/').filter(Boolean);
            // Если в пути есть что-то помимо имени репозитория
            if (parts.length > 1) {
                query = decodeURIComponent(parts.slice(1).join('/'));
            }
        }

        if (query) {
            redirectTo4get(query);
        }

        // 2. Обработка ввода прямо на странице
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                redirectTo4get(q);
            }
        });
    </script>
</body>
</html>

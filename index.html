<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuslSearch</title>
    <link rel="search" type="application/opensearchdescription+xml" title="RuslSearch" href="opensearch.xml">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --card-hover: #21262d;
            --accent: #00ffcc;
            --glow: rgba(0, 255, 204, 0.25);
            --text: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--glow);
            cursor: pointer;
        }

        h1 span {
            color: var(--accent);
        }

        .search-form {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 16px 22px;
            font-size: 1.1rem;
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }

        button.search-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 0 26px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.search-btn:hover {
            background-color: #00e6b8;
            box-shadow: 0 0 12px var(--accent);
        }

        #status {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .result-card:hover {
            border-color: var(--accent);
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .result-title a {
            color: var(--accent);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 6px;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-url {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
            word-break: break-all;
        }

        .result-snippet {
            color: #c9d1d9;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .welcome-screen {
            text-align: center;
            color: var(--muted);
            margin-top: 50px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 onclick="window.location.href='index.html'">RUSL<span>SEARCH</span></h1>
        </header>

        <form id="searchForm" class="search-form" action="index.html" method="get">
            <input type="text" name="q" id="searchInput" placeholder="Введите любой запрос (ютуб, фильмы)..." required autocomplete="off" autofocus>
            <button type="submit" class="search-btn">ИСКАТЬ</button>
        </form>

        <div id="status">⚡ Запрос к DuckDuckGo...</div>
        <div id="results" class="results-list">
            <div class="welcome-screen" id="welcome">Введите запрос в строку выше или используйте адресную строку LibreWolf.</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const status = document.getElementById('status');
        const welcome = document.getElementById('welcome');

        // Читаем запрос из URL параметров (?q=...)
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');

        if (query) {
            input.value = query;
            document.title = `${query} — RuslSearch`;
            performDuckDuckGoSearch(query);
        }

        async function performDuckDuckGoSearch(q) {
            if (welcome) welcome.style.display = 'none';
            status.style.display = 'block';
            resultsContainer.innerHTML = '';

            // Команды для быстрого перехода
            if (q.startsWith('/github') || q.startsWith('/gh')) {
                const term = q.replace(/^\/(github|gh)\s*/i, '');
                window.location.href = `https://github.com/search?q=${encodeURIComponent(term)}`;
                return;
            }
            if (q.startsWith('/youtube') || q.startsWith('/yt')) {
                const term = q.replace(/^\/(youtube|yt)\s*/i, '');
                window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}`;
                return;
            }

            try {
                // Запрос к DuckDuckGo API
                const apiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Ошибка сети');

                const data = await response.json();
                status.style.display = 'none';

                let hasResults = false;

                // Основная карточка ответа
                if (data.Heading && data.Abstract) {
                    hasResults = true;
                    renderCard(data.Heading, data.AbstractURL || '#', data.Abstract);
                }

                // Связанные темы
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(item => {
                        if (item.Text && item.FirstURL) {
                            hasResults = true;
                            const title = item.Text.split(' - ')[0] || item.FirstURL;
                            renderCard(title, item.FirstURL, item.Text);
                        }
                    });
                }

                if (!hasResults) {
                    resultsContainer.innerHTML = `
                        <div class="result-card" style="text-align: center;">
                            <p class="result-snippet">Прямой выдачи не найдено. Открыть поиск в DuckDuckGo:</p><br>
                            <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}" style="color: var(--accent); font-weight: bold; font-size: 1.1rem;">Открыть в DuckDuckGo &rarr;</a>
                        </div>
                    `;
                }

            } catch (err) {
                status.style.display = 'none';
                resultsContainer.innerHTML = `
                    <div class="result-card" style="text-align: center;">
                        <p class="result-snippet">Ошибка запроса. Открыть поиск в DuckDuckGo:</p><br>
                        <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}" style="color: var(--accent); font-weight: bold; font-size: 1.1rem;">Открыть в DuckDuckGo &rarr;</a>
                    </div>
                `;
            }
        }

        function renderCard(title, url, snippet) {
            const card = document.createElement('div');
            card.className = 'result-card';
            // Без target="_blank", ссылки открываются в этой же вкладке
            card.innerHTML = `
                <div class="result-title">
                    <a href="${url}">${title}</a>
                </div>
                <div class="result-url">${url}</div>
                <div class="result-snippet">${snippet}</div>
            `;
            resultsContainer.appendChild(card);
        }
    </script>
</body>
</html>
